name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install uv
        run: python -m pip install uv==0.12.6
      - name: Sync locked development environment
        run: python -m uv sync --frozen --extra dev
      - name: Test
        run: python -m uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Lint
        run: python -m uv run ruff check src tests scripts
      - name: Check formatting
        run: python -m uv run ruff format --check src tests scripts
      - name: Type check
        run: python -m uv run mypy src
      - name: Audit installed dependencies
        run: python -m uv run pip-audit --local --skip-editable
      - name: Build and validate distributions
        run: |
          python -m uv build
          python -m uv run twine check dist/*
