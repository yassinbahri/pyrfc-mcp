[project]
name = "pyrfc-mcp"
version = "0.1.0"
description = "MCP server exposing SAP RFC-enabled function modules to AI agents"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yassin Bahri" }]
keywords = ["abap", "mcp", "sap", "rfc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "anyio>=4.4,<5",
    "httpx>=0.27,<1",
    "mcp[cli]>=2.0,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
# PyRFC 3.3.1 is yanked and its upstream repository is archived. It remains
# optional so contributors can install/test the MCP server without SAP's SDK.
# See docs/setup.md before enabling real RFC connectivity.
sap = ["pyrfc==3.3.1"]
dev = [
    "build>=1.2,<2",
    "mypy>=1.14,<3",
    "pip-audit>=2.10,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "pytest-mock>=3.14,<4",
    "ruff>=0.9,<1",
    "twine>=7,<8",
]

[project.scripts]
rfc-mcp = "rfc_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfc_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/.env.example",
    "/.mcp.json.example",
    "/.python-version",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/docs",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
    "/usage.md",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/smoke_test.py" = ["E402"]
"tests/test_sap_exceptions.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pyrfc"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["rfc_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true
